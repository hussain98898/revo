  /* ---------- Charts (right to left, one accent, quiet grid) ---------- */
  function niceStep(max) { const raw = max / 4; const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
  // data: [{label, value, tip, muted, hi}]

        : 'M' + (x(i) - bw / 2) + ' ' + y0 + 'V' + (y1 - r) + 'q0 ' + r + ' ' + r + ' ' + r + 'H' + (x(i) + bw / 2 - r) + 'q' + r + ' 0 ' + r + ' -' + r + 'V' + y0 + 'Z') : '';

    }).join('');

  }

  // Files: images are made smaller before they are kept, so the record stays light.

  // Restore: the file is checked first (signature, version, every balance). On a shared log a restore would overwrite other devices' work, so it is refused there.
  async function restoreBackup(file) {
    try {
      const b = JSON.parse(await file.text()); const s2 = E.importState(b);
      if (isDemo()) return toast('في وضع التجربة أعد البيانات التجريبية بدل الاستعادة', 'warn');
      if (ST.shared) return toast('النسخة سليمة، لكن الاستعادة فوق السجل المشترك غير متاحة هنا لأنها تمحو عمل الأجهزة الأخرى. تحتاج ربطًا بخادم', 'warn');
      // Before anything is replaced: what the backup holds next to what this device holds now, so the person sees exactly what changes.
      const cmp = (a, c) => nf(a, 0, 0) + (a === c ? '' : ' (الآن ' + nf(c, 0, 0) + ')');
      const cmpM = (a, c) => m$(a) + (a === c ? '' : ' (الآن ' + m$(c) + ')');
      const txt = 'النسخة سليمة وتجتاز فحص الأرقام. أُخذت ' + dtm(b.at) + '.<br>الطلبات: ' + cmp(s2.orders.length, S.orders.length) + '<br>القيود: ' + cmp(s2.journal.length, S.journal.length) + '<br>الخزنة: ' + cmpM(E.bal(s2, '1190'), E.bal(S, '1190')) + '<br>المخزون: ' + cmpM(E.bal(s2, '1300') + E.bal(s2, '1310') + E.bal(s2, '1320'), E.bal(S, '1300') + E.bal(S, '1310') + E.bal(S, '1320')) + '<br>تستبدل كل بيانات هذا الجهاز.';
      confirmBox({ title: 'استعادة نسخة', text: txt, ok: 'استعادة', danger: true, onOk: async () => {
        try {
          await localDb('live.db').wipe(); await KV.set('live.pending', []); await KV.set('live.confirmed', { v: E.VERSION, seq: 0, last: null, chunk: 0, snapSeq: 0, json: JSON.stringify(s2) });
          toast('استُعيدت النسخة. يُعاد التحميل'); setTimeout(() => location.reload(), 800);
        } catch (e2) { toast('لم تُستعد النسخة: ' + (e2.message || 'تعذّر الحفظ'), 'bad', 9000); }
      } });
    } catch (err) { toast(err.message || 'الملف غير صالح', 'bad'); }
  }

  ACT.siteCheckout = () => { const s = SITE.st(); if (!s.cart.length) return toast('أضف صنفًا أولًا', 'bad'); closeModal(); s.view = 'checkout'; render(); window.scrollTo(0, 0); };
  ACT.siteType = el => { SITE.st().type = el.dataset.v; SITE.save(); render(); };
  ACT.siteQty = el => { const s = SITE.st(); const l = s.cart[Number(el.dataset.v)]; if (!l) return; l.qty += Number(el.dataset.w); if (l.qty <= 0) s.cart.splice(Number(el.dataset.v), 1); SITE.save(); if (!s.cart.length) { closeModal(); s.view = 'menu'; } render(); if (UI.modal && UI.modal.kind === 'siteCart') renderModal(); };
  FILES.siteProof = id => { setF('site', { att: id }); render(); };
  ACT.sitePlace = async () => {
    const s = SITE.st(); const f = F('site'); const token = f.token || (f.token = randHex(8)); // one token per checkout, so a double tap places one order
    const r = await run('web.place', { type: s.type, lines: s.cart.map(l => ({ itemId: l.itemId, qty: l.qty, choices: l.choices, note: l.note || undefined })), note: f.note, customer: { name: f.name, phone: f.phone, address: f.address, zoneId: s.type === 'delivery' ? f.zone : undefined }, pay: f.pay, ref: f.ref, attachmentId: f.att || undefined, token }, { as: 'web', device: 'W', key: 'web:' + token });
    if (r && r.no) { const ph = E.normPhone(f.phone || ''); s.last = { name: String(f.name || '').trim(), phone: ph.ok ? ph.e164 : f.phone, addresses: s.type === 'delivery' && f.address ? [{ zoneId: f.zone || null, text: f.address }] : (s.last && s.last.addresses) || [] }; s.track = { no: r.no, token }; s.cart = []; s.view = 'track'; SITE.save(); clearF('site'); render(); window.scrollTo(0, 0); }
  };
  ACT.siteNew = () => { const s = SITE.st(); s.view = 'menu'; s.done = null; SITE.save(); clearF('sitecp'); render(); window.scrollTo(0, 0); };
  ACT.siteComplain = async () => {
    const s = SITE.st(); const f = F('sitecp');
    if (!f.category) return toast('اختر نوع الملاحظة', 'bad'); if (!String(f.text || '').trim()) return toast('اكتب ما حدث', 'bad');
    const r = await run('web.complain', { category: f.category, text: f.text, name: f.name, phone: f.phone, orderNo: f.orderNo, token: s.track && f.orderNo === s.track.no ? s.track.token : undefined }, { as: 'web', device: 'W' });
    if (r && r.id) { s.done = { kind: 'complaint', id: r.id }; clearF('sitecp'); render(); window.scrollTo(0, 0); }
  };
  ACT.siteSignup = async () => {
    const s = SITE.st(); const f = F('siteme');
    const r = await run('web.signup', { name: f.name, phone: f.phone, address: f.address, zoneId: f.zone }, { as: 'web', device: 'W' });
    if (r && r.id) { s.me = { id: r.id, name: r.name, phone: r.phone, addresses: r.addresses || [] }; s.meEdit = false; SITE.save(); clearF('siteme'); clearF('site'); toast('أهلًا ' + r.name + '، حُفظت بياناتك'); render(); }
  };
  ACT.siteMeEdit = () => { const s = SITE.st(); const a0 = (s.me.addresses || [])[0]; setF('siteme', { name: s.me.name, phone: phoneTxt(s.me.phone), zone: a0 ? a0.zoneId : '', address: a0 ? a0.text : '' }); s.meEdit = true; render(); };
  ACT.siteMeOut = () => { const s = SITE.st(); s.me = null; s.last = null; s.meEdit = false; SITE.save(); clearF('site'); render(); };
  SCREENS.site = { name: 'موقع الطلبات', icon: 'globe', perm: ['settings'], render: () => '' };
  /* =================== Events and start =================== */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    const f = ACT[el.dataset.act]; if (!f) { console.warn('missing action: ' + el.dataset.act); return; }
    if (el.tagName === 'A') return;
    f(el, e);
  });
  const liveRender = debounce(() => { if (UI.modal) renderModal(); else render(); }, 220);
  function dispatch(map, e) {
    const el = e.target; if (!el || !el.dataset) return;
    if (el.dataset.f && map === IN) { const [k, f] = el.dataset.f.split('.'); F(k)[f] = el.type === 'checkbox' ? el.checked : el.value; if (el.dataset.live) liveRender(); return; }
    if (el.dataset.f && map === CH && el.tagName === 'SELECT') { const [k, f] = el.dataset.f.split('.'); F(k)[f] = el.value; rerender(); return; }
    for (const key of Object.keys(el.dataset)) { if (map[key]) { map[key](el, e); return; } }
  }
  document.addEventListener('input', e => dispatch(IN, e));
  document.addEventListener('change', e => dispatch(CH, e));
  document.addEventListener('toggle', e => { const d = e.target; if (d && d.classList && d.classList.contains('attn-card')) UI.attOpen = d.open; }, true);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (UI.modal && !UI.modal.sticky) closeModal(); else if (UI.modal) closeModal(); else if (UI.drawer) closeDrawer(); else if (UI.side) { UI.side = false; render(); } return; }
    if (UI.modal && (UI.modal.kind === 'pin' || (UI.modal.kind === 'approve' && UI.modal.who)) && (/^\d$/.test(e.key) || e.key === 'Backspace')) { e.preventDefault(); ACT[UI.modal.kind === 'pin' ? 'pinKey' : 'apprKey']({ dataset: { v: e.key === 'Backspace' ? '⌫' : E.normDigits(e.key) } }); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr.click,[role=button]')) { e.preventDefault(); e.target.click(); return; }
    // Moving a card while customizing: arrows move it, + and − resize it.
    if (UI.edit && e.target.dataset && e.target.dataset.wid) { const id = e.target.dataset.wid; if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); ACT.wMove({ dataset: { v: id, w: '-1' } }); } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); ACT.wMove({ dataset: { v: id, w: '1' } }); } else if (e.key === '+' || e.key === '=') ACT.wSize({ dataset: { v: id, w: '1' } }); else if (e.key === '-') ACT.wSize({ dataset: { v: id, w: '-1' } }); return; }
    if (!UI.modal && !UI.drawer && UI.user && KEYS[UI.screen] && KEYS[UI.screen](e)) e.preventDefault();
  });
  // Keep live screens current without disturbing typing.
  setInterval(() => { if (!S || !UI.user || UI.modal || isTyping() || UI.edit) return; if (['orders', 'printers', 'dashboard', 'treasury', 'banks'].includes(UI.screen)) render(); }, 20000);
  setInterval(printAgentTick, 2500);
  DEV.printAgent = LS.get('revo5.agent', null);
  if (DEV.printAgent == null) DEV.printAgent = DEV.mode === 'demo';
  window.addEventListener('beforeunload', e => { if (SYNC && SYNC.st.pending.length) { e.preventDefault(); e.returnValue = ''; } });
  applyTheme();
  if (location.hash === '#site') UI.view = 'site';
  if (DEV.mode) bootStore(); else render();
  // The test harness handle exists only in the harness build (html[data-harness]); the published page exposes nothing on window.
  if (document.documentElement.dataset.harness != null) window.__REVO__ = { E, UI, ACT, SCREENS, MODALS, DRAWERS, render, get S() { return S; }, get SYNC() { return SYNC; }, DEV, POS, run, KV, ST };
})();
