<style>
/* =====================================================================
   Revo design system. One set of tokens and components for every screen.
   Sizes: controls 40 (44 on touch), small 32, large 48, pay 56.
   Spacing: 4 · 8 · 12 · 16 · 20 · 24 · 32. Radius: 6 · 8 · 12 · 16.
   ===================================================================== */
:root {
  --brand-base: #006AFF;
  --brand: var(--brand-base);
  --brand-ink: #FFFFFF;
  --brand-soft: color-mix(in srgb, var(--brand) 9%, var(--bg));
  --brand-line: color-mix(in srgb, var(--brand) 35%, var(--bg));
  --bg: #FFFFFF; --bg-2: #F6F7F9; --fill: #F0F2F4; --fill-2: #E6E9ED;
  --line: #E3E6EA; --line-2: #CBD0D7;
  --ink: #15181C; --ink-2: #5B636E; --ink-3: #8A929D;
  --good: #0A7A3A; --good-fill: #12A150; --good-soft: #E7F5EC;
  --warn: #8C4F00; --warn-fill: #F59E0B; --warn-soft: #FFF3DC;
  --bad: #C4122F; --bad-fill: #E5484D; --bad-soft: #FDEBEE;
  --chart-1: #006aff; --chart-2: #eb6834; --chart-3: #1baf7a; --chart-4: #9b51e0; --chart-5: #d9a400; --chart-muted: #D3D7DD; --grid: #EDEFF2;
  --paper: #FFFFFF; --paper-ink: #111111;
  --shadow-1: 0 1px 2px rgba(16, 24, 40, .06);
  --shadow: 0 12px 32px rgba(16, 24, 40, .16);
  --r-xs: 6px; --r-sm: 8px; --r: 12px; --r-lg: 16px;
  --h-sm: 32px; --h: 40px; --h-lg: 48px; --h-xl: 56px;
  --f: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --side-w: 256px;
}
/* Touch: every repeated control is at least 44 by 44 CSS pixels, with a visible focus ring. */
@media (pointer: coarse) { :root { --h-sm: 44px; --h: 48px; --h-lg: 52px; } }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: color-mix(in srgb, var(--brand-base) 72%, #ffffff); --brand-ink: #0A0C0F;
    --bg: #111417; --bg-2: #171B1F; --fill: #20252B; --fill-2: #2A3037; --line: #262C33; --line-2: #3A424B;
    --ink: #EEF1F4; --ink-2: #A3ACB6; --ink-3: #737D88;
    --good: #4CD07D; --good-fill: #2FB362; --good-soft: #10261A; --warn: #FFB547; --warn-fill: #F59E0B; --warn-soft: #2C2210; --bad: #FF6B7E; --bad-fill: #E5484D; --bad-soft: #33151B;
    --chart-1: #3d8bf0; --chart-2: #e06a3a; --chart-3: #24a878; --chart-4: #a874e8; --chart-5: #d6a92a; --chart-muted: #39414A; --grid: #22282E;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .3); --shadow: 0 12px 32px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: color-mix(in srgb, var(--brand-base) 72%, #ffffff); --brand-ink: #0A0C0F;
  --bg: #111417; --bg-2: #171B1F; --fill: #20252B; --fill-2: #2A3037; --line: #262C33; --line-2: #3A424B;
  --ink: #EEF1F4; --ink-2: #A3ACB6; --ink-3: #737D88;
  --good: #4CD07D; --good-fill: #2FB362; --good-soft: #10261A; --warn: #FFB547; --warn-fill: #F59E0B; --warn-soft: #2C2210; --bad: #FF6B7E; --bad-fill: #E5484D; --bad-soft: #33151B;
  --chart-1: #3d8bf0; --chart-2: #e06a3a; --chart-3: #24a878; --chart-4: #a874e8; --chart-5: #d6a92a; --chart-muted: #39414A; --grid: #22282E;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .3); --shadow: 0 12px 32px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

/* ---------- Base ---------- */
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.row-note { flex: 1 1 260px; min-width: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

p { margin: 0; }
hr { border: 0; border-top: 1px solid var(--line); margin: 0; width: 100%; }
img { max-width: 100%; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.mono { font-family: var(--f-mono); direction: ltr; unicode-bidi: isolate; display: inline-block; letter-spacing: 0; font-weight: 600; white-space: nowrap; }
.tnum, table { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13.5px; }
.xs { font-size: 12.5px; }
.b { font-weight: 700; }
.sp { flex: 1; }
.hide { display: none !important; }
.bad-t { color: var(--bad); } .good-t { color: var(--good); } .warn-t { color: var(--warn); }
.ltr-in { direction: ltr; text-align: end; }

/* ---------- Layout helpers ---------- */
.row { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; min-width: 0; }
.row.nw { flex-wrap: nowrap; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; }

.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); }
.content { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-content: start; min-width: 0; }
.content > .btn, .card-b > .btn, .modal-b > .btn, .stack > .btn, .sec-bd > .btn { justify-self: start; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--h); padding: 0 16px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--bg); color: var(--ink); font-size: 14.5px; font-weight: 600; white-space: nowrap; text-decoration: none; transition: background .12s, border-color .12s; flex: none; }
.btn:hover { background: var(--fill); }
.btn.ghost { background: var(--bg); border-color: var(--line-2); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.quiet:hover { background: var(--fill); color: var(--ink); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { background: color-mix(in srgb, var(--brand) 88%, #000); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.danger { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.btn.danger:hover { background: color-mix(in srgb, var(--bad) 16%, var(--bg)); }
.btn.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
.btn.good:hover { background: color-mix(in srgb, var(--good) 16%, var(--bg)); }
.btn.link { background: none; border-color: transparent; padding: 0 4px; height: auto; min-height: 28px; color: var(--brand); font-weight: 600; }
.btn.link:hover { background: none; text-decoration: underline; }
.btn.link.bad-t { color: var(--bad); }
.btn.sm { height: var(--h-sm); padding: 0 12px; font-size: 13.5px; gap: 6px; }
.btn.lg { height: var(--h-lg); padding: 0 20px; font-size: 15.5px; }
.btn.xl { height: var(--h-xl); padding: 0 22px; font-size: 17px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.sm svg { width: 16px; height: 16px; }
.btn.ib { width: var(--h); padding: 0; color: var(--ink-2); }
.btn.ib.sm { width: var(--h-sm); }
.btn.ib:hover { color: var(--ink); }
.ib { width: var(--h-sm); height: var(--h-sm); border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--bg); display: inline-grid; place-items: center; padding: 0; color: var(--ink-2); flex: none; }
.ib svg { width: 16px; height: 16px; }
.ib.on { color: #B78100; border-color: #D9A400; background: color-mix(in srgb, #D9A400 14%, var(--bg)); }
.ib.on svg { fill: currentColor; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.x { width: 36px; height: 36px; border-radius: var(--r-sm); border: 0; background: transparent; font-size: 22px; line-height: 1; color: var(--ink-2); flex: none; display: inline-grid; place-items: center; }
.x:hover { background: var(--fill); color: var(--ink); }
.x.sm { width: var(--h); height: var(--h); font-size: 20px; border: 1px solid var(--line); }
.filebtn { cursor: pointer; }
.filebtn input { display: none; }

/* ---------- Form controls ---------- */
input[type=text], input[type=tel], input[type=number], input[type=search], input[type=password], input[type=date], input[type=month], input[type=datetime-local], select, textarea {
  width: 100%; height: var(--h); padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--bg); outline: none; font-size: 15px; min-width: 0;
}
select { padding-inline-end: 8px; }
textarea { padding: 10px 12px; height: auto; min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
input[disabled], select[disabled] { background: var(--fill); color: var(--ink-2); }
input.sm, select.sm { height: var(--h-sm); font-size: 14px; }
input[type=number] { direction: ltr; text-align: end; }
input[type=date] { max-width: 260px; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--brand); margin: 0; }
::placeholder { color: var(--ink-3); }
label.f { display: grid; gap: 6px; min-width: 0; align-content: start; }
label.f > span:first-child { font-size: 13.5px; color: var(--ink-2); font-weight: 600; }
.hint { font-size: 12.5px; color: var(--ink-3); line-height: 1.45; }
.affix { display: flex; align-items: stretch; height: var(--h); border: 1px solid var(--line-2); border-radius: var(--r-sm); overflow: hidden; background: var(--bg); }
.affix:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
.affix input { border: 0 !important; box-shadow: none !important; border-radius: 0; height: 100%; }
.affix > span { display: grid; place-items: center; padding: 0 12px; background: var(--fill); color: var(--ink-2); font-size: 13.5px; white-space: nowrap; }
.ro { height: var(--h); display: flex; align-items: center; padding: 0 12px; border-radius: var(--r-sm); background: var(--fill); font-weight: 700; }
.search { position: relative; flex: 1 1 240px; max-width: 420px; min-width: 0; }
.search > svg { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-3); pointer-events: none; }
.search input { padding-inline-start: 40px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--fill); border-radius: 10px; flex-wrap: wrap; max-width: 100%; }
.seg button { border: 0; background: none; height: calc(var(--h) - 6px); padding: 0 14px; border-radius: 7px; font-weight: 600; font-size: 14px; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button svg { width: 16px; height: 16px; flex: none; }
.seg.sm button { font-size: 13px; padding: 0 10px; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(16, 24, 40, .14); }
.seg.full { display: flex; } .seg.full button { flex: 1; }
.switch { position: relative; width: 44px; height: 26px; border-radius: 99px; background: var(--line-2); border: 0; padding: 0; flex: none; }
.switch::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: inset-inline-start .15s; }
.switch.on { background: var(--brand); }
.switch.on::after { inset-inline-start: 21px; }
.swrow { display: flex; align-items: center; gap: 12px; min-height: var(--h); }
.swrow > span { flex: 1; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.inl { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); }
.inl select, .inl input { width: auto; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.toolbar > select, .toolbar > label.f, .toolbar > .f, .tbl-bar > select, .tbl-bar > input, .row > select, .row.nw > select { width: auto; min-width: 150px; flex: 0 1 200px; }
.tbl-bar > .btn, .tbl-bar > .check { flex: none; }

/* ---------- Status ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; background: var(--fill); color: var(--ink-2); white-space: nowrap; vertical-align: middle; }
.pill.dot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.brand { background: var(--brand-soft); color: var(--brand); }
.pill.dark { background: var(--ink); color: var(--bg); }
.pill svg { width: 14px; height: 14px; }
.pills { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--fill-2); color: var(--ink-2); font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; line-height: 1; }
.badge.bad { background: var(--bad); color: #fff; }
.cnt { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--fill-2); color: var(--ink-2); font-size: 12px; font-weight: 700; line-height: 1; }
.cdot { width: 8px; height: 8px; border-radius: 99px; background: var(--line-2); display: inline-block; flex: none; }
.cdot.good { background: var(--good-fill); } .cdot.bad { background: var(--bad-fill); } .cdot.warn { background: var(--warn-fill); }
.chip { display: inline-flex; align-items: center; gap: 8px; height: var(--h); padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--bg); font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.chip svg { width: 18px; height: 18px; }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.good { color: var(--ink); }
.chip.good .cdot { background: var(--good-fill); }
.chip.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.chip.sm { height: var(--h-sm); padding: 0 10px; font-size: 13px; }

/* ---------- Notes and empty states ---------- */
.note { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); color: var(--ink); font-size: 14px; line-height: 1.55; }
.note > svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--ink-2); }
.note > .nt { flex: 1; min-width: 0; }
.note > .btns, .note > .btn { margin-inline-start: auto; align-self: center; }
.note.warn { background: var(--warn-soft); border-color: transparent; } .note.warn > svg { color: var(--warn); }
.note.bad { background: var(--bad-soft); border-color: transparent; } .note.bad > svg { color: var(--bad); }
.note.good { background: var(--good-soft); border-color: transparent; } .note.good > svg { color: var(--good); }
.note.brand { background: var(--brand-soft); border-color: transparent; } .note.brand > svg { color: var(--brand); }
.empty { display: grid; justify-items: center; gap: 6px; padding: 32px 16px; text-align: center; color: var(--ink-2); font-size: 14px; }
.empty > svg { width: 28px; height: 28px; color: var(--ink-3); margin-bottom: 2px; }
.empty b { color: var(--ink); font-size: 15px; }
.empty .btn { margin-top: 6px; }
.empty.sm { padding: 18px 12px; }

/* ---------- Cards and sections ---------- */
.card { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 6px 12px; padding: 14px 16px 0; flex-wrap: wrap; min-height: 46px; }
.card-h + .card-b { padding-top: 12px; }
.card-h h3 { font-size: 16px; font-weight: 700; }
.card-h .hint { flex-basis: 100%; margin-top: -4px; }
.card-h.nw { flex-wrap: nowrap; } .card-h.nw h3 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-b { padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; min-width: 0; }
.card-b:empty { display: none; }
.card.flush > .card-b { padding: 8px 0 0; }
.sec { display: grid; gap: 12px; min-width: 0; }
.sec-hd { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; min-height: var(--h); }
.sec-hd h2 { font-size: 17px; font-weight: 700; }
.sec-bd { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; }
.sec-h { font-size: 15px; font-weight: 700; margin: 6px 0 0; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; font-size: 14px; align-items: baseline; }
.kv > span { color: var(--ink-2); min-width: 0; }
.kv > b { text-align: end; font-weight: 600; }
.kv > span .sub, .kv > b .sub { display: block; font-size: 12.5px; font-weight: 400; color: var(--ink-3); margin-top: 2px; }
.kv > span:has(> .sub) { color: var(--ink); }
.kv > b b { font-weight: 700; }
.kv.big > b { font-size: 16px; }

/* List rows: one record per row, the same shape in every list */
.list { display: grid; }
.item { display: flex; align-items: center; gap: 10px 16px; padding: 14px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; min-width: 0; }
.list > .item:first-child { border-top: 0; }
.card-b > .list { margin-inline: -16px; }
.card-b > .list:first-child { margin-top: -16px; }
.card-h + .card-b > .list:first-child { margin-top: -2px; border-top: 1px solid var(--line); }
.card-b > .list:last-child { margin-bottom: -16px; }
.card > .list > .item:last-child { border-radius: 0 0 var(--r) var(--r); }
.item-ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--fill); color: var(--ink-2); }
.item-ic svg { width: 18px; height: 18px; }
.item-ic.warn { background: var(--warn-soft); color: var(--warn); } .item-ic.bad { background: var(--bad-soft); color: var(--bad); } .item-ic.good { background: var(--good-soft); color: var(--good); } .item-ic.brand { background: var(--brand-soft); color: var(--brand); }
.item-m { flex: 1 1 220px; min-width: 0; display: grid; gap: 2px; }
.item-m > b { font-size: 15px; font-weight: 700; }
.item-m > span { font-size: 13.5px; color: var(--ink-2); }
.item-v { text-align: end; display: grid; gap: 2px; justify-items: end; }
.item-v > b { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.item-v > span { font-size: 13px; color: var(--ink-2); }
.item-a { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.item-x { flex-basis: 100%; min-width: 0; }
.item.hot { box-shadow: inset 3px 0 0 var(--brand); }
.item.alert { box-shadow: inset 3px 0 0 var(--bad-fill); }

/* ---------- Tables ---------- */
.tbl td.nw, .tbl th.nw { white-space: nowrap; }
.tbl td.quiet { color: var(--ink-2); font-size: 13px; line-height: 1.55; }
.tbl-wrap { display: grid; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; overflow: hidden; }
.tbl-bar { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); min-height: 56px; }
.tbl-bar .search { max-width: 360px; }
.tbl { overflow-x: auto; min-width: 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: start; font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 10px 16px; background: var(--bg-2); border-bottom: 1px solid var(--line); white-space: nowrap; height: 40px; }
td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; height: 52px; }
tbody tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: end; white-space: nowrap; }
td .sub { display: block; font-size: 12.5px; color: var(--ink-2); font-weight: 400; margin-top: 1px; }

.pager { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px; border-top: 1px solid var(--line); }
.tbl-wrap > .empty { border-top: 0; }
.card-b > .tbl-wrap, .card-b > .tbl { margin: 0 -16px -16px; border: 0; border-radius: 0 0 var(--r) var(--r); border-top: 1px solid var(--line); }
.card-b > .tbl-wrap > .tbl-bar { padding-inline: 16px; }
.card-b > .tbl:not(:last-child), .card-b > .tbl-wrap:not(:last-child) { margin-bottom: 0; border-radius: 0; border-bottom: 1px solid var(--line); }
.modal-b > .tbl-wrap, .modal-b .tbl-wrap { border-radius: 10px; }
.card-b > .tbl:first-child, .card-b > .tbl-wrap:first-child { margin-top: -16px; border-top: 0; }
.card-h + .card-b > .tbl:first-child, .card-h + .card-b > .tbl-wrap:first-child { margin-top: 0; border-top: 1px solid var(--line); }
.perm-tbl td, .perm-tbl th { text-align: center; padding: 8px 10px; height: 40px; }
.perm-tbl td:first-child, .perm-tbl th:first-child { text-align: start; }

.perm-tbl .grp td { background: var(--bg-2); font-weight: 700; font-size: 13px; color: var(--ink-2); text-align: start; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100%; }
.side { background: var(--bg-2); border-inline-end: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brandmark { display: flex; align-items: center; gap: 12px; padding: 4px 8px 16px; }
.logo { width: 40px; height: 40px; border-radius: 10px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 700; font-size: 20px; flex: none; }
.logo.img { object-fit: contain; background: var(--bg); border: 1px solid var(--line); padding: 3px; }
.brandmark b { display: block; font-size: 16px; line-height: 1.25; }
.brandmark span { font-size: 12.5px; color: var(--ink-2); }

.nav { display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 40px; border-radius: var(--r-sm); border: 0; background: none; text-align: start; color: var(--ink); font-size: 14.5px; font-weight: 500; width: 100%; flex: none; }
.nav svg { width: 20px; height: 20px; color: var(--ink-2); flex: none; }
.nav:hover { background: var(--fill-2); }
.nav.on { background: var(--bg); font-weight: 700; box-shadow: var(--shadow-1); }
.nav.on svg { color: var(--brand); }
.nav .badge { margin-inline-start: auto; }
.side-foot { margin-top: auto; padding: 12px 0 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.side-foot > * { min-width: 0; }
.side { overflow-x: hidden; scrollbar-width: thin; }
.me { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.me > div:nth-child(2) { min-width: 0; }
.me b { display: block; font-size: 14px; line-height: 1.3; } .me span { font-size: 12px; color: var(--ink-2); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me .btn.ib { width: 32px; height: 32px; }
.syncbox { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 10px; font-size: 12.5px; color: var(--ink-2); text-align: start; border-radius: var(--r-sm); }
.syncbox:hover { background: var(--fill-2); }
.main { min-width: 0; padding: 24px 32px 48px; }
.main-in { max-width: 1440px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.top { display: flex; align-items: flex-start; gap: 12px 16px; flex-wrap: wrap; }
.top-t { min-width: 0; flex: 1 1 320px; display: grid; gap: 2px; }
.top h1 { font-size: 24px; }
.top p { color: var(--ink-2); font-size: 14.5px; }
.top-a { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.menu-btn { display: none !important; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; height: 44px; padding: 0 14px; font-weight: 600; font-size: 14.5px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); border-color: var(--brand); }
.tabs button.on .cnt { background: var(--brand); color: var(--brand-ink); }
.strip { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; font-size: 14px; flex-wrap: wrap; }
.strip > svg { width: 18px; height: 18px; flex: none; }
.strip.warn { background: var(--warn-soft); color: var(--warn); } .strip.bad { background: var(--bad-soft); color: var(--bad); }
.busy { position: fixed; top: 12px; inset-inline-end: 12px; z-index: 95; background: var(--bg); border-radius: 99px; padding: 8px; box-shadow: var(--shadow); color: var(--brand); }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-top-color: transparent; animation: rot .7s linear infinite; }
.spin.lg { width: 34px; height: 34px; border-width: 3px; color: var(--brand); }
@keyframes rot { to { transform: rotate(360deg); } }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 700; flex: none; font-size: 15px; }
.avatar.lg { width: 60px; height: 60px; font-size: 24px; }

.meter { height: 8px; border-radius: 99px; background: var(--fill); overflow: hidden; min-width: 60px; }
.meter > i { display: block; height: 100%; border-radius: 99px; background: var(--good-fill); }
.meter.warn > i { background: var(--warn-fill); } .meter.bad > i { background: var(--bad-fill); }

/* ---------- Sign in and first choice ---------- */
.login { min-height: 100%; display: grid; place-items: center; padding: 32px 16px; background: var(--bg-2); }
.login-in { width: min(860px, 100%); display: grid; gap: 24px; }
.login .narrow-in { width: min(640px, 100%); }
.login-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.login-head .logo { width: 56px; height: 56px; font-size: 28px; border-radius: 14px; }
.login-head h1 { font-size: 26px; }
.users { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.user { display: grid; justify-items: center; align-content: start; gap: 6px; padding: 20px 12px 16px; border-radius: var(--r); background: var(--bg); border: 1px solid var(--line); text-align: center; min-height: 168px; }
.user:hover { border-color: var(--brand-line); box-shadow: var(--shadow-1); }
.user .avatar { margin-bottom: 4px; }
.user b { font-size: 16px; } .user span { font-size: 13px; color: var(--ink-2); }
.user .pin-hint { font-size: 12px; color: var(--ink-3); background: var(--fill); border-radius: 99px; padding: 1px 10px; margin-top: 2px; }
.user.site { background: var(--ink); color: var(--bg); border-color: var(--ink); } .user.site span { color: color-mix(in srgb, var(--bg) 72%, transparent); }
.pinpad { display: grid; gap: 18px; justify-items: center; padding: 8px 0 4px; }
.dots { display: flex; gap: 14px; direction: ltr; }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-2); }
.dots i.on { background: var(--ink); border-color: var(--ink); }
.dots.err i { border-color: var(--bad); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.keys { display: grid; grid-template-columns: repeat(3, 76px); gap: 10px; direction: ltr; }
.keys button { height: 64px; border-radius: 12px; border: 0; background: var(--fill); font-size: 24px; font-weight: 600; }
.keys button:hover { background: var(--fill-2); }
.choice { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r); border: 2px solid var(--line); background: var(--bg); width: 100%; text-align: start; }
.choice:hover { border-color: var(--line-2); }
.choice.on { border-color: var(--brand); background: var(--brand-soft); }
.choice .rb { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-2); flex: none; }
.choice.on .rb { border: 6px solid var(--brand); }
.choice.big { align-items: flex-start; padding: 20px; min-height: 128px; }
.choice.big b { font-size: 17px; }

.choice-t { display: grid; gap: 6px; }
.boot { justify-items: center; text-align: center; }
.side-scrim { z-index: 65 !important; background: rgba(10, 14, 20, .3) !important; }
.main.bare { padding: 0; }
.att-img { max-width: 100%; border-radius: 8px; display: block; }
.num-in { width: 88px !important; }
.legend i.lg-1 { background: var(--chart-1); } .legend i.lg-m { background: var(--chart-muted); }
.self-att { justify-items: start; gap: 10px; }
.share-hist { min-height: var(--h); display: flex; align-items: center; }
.ocard .meta > span { display: inline-flex; align-items: center; gap: 4px; }
.ocard .meta svg { width: 14px; height: 14px; }

/* ---------- Cashier ---------- */
.pos { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: 100vh; }
.pos-left { padding: 16px 20px 24px; overflow-y: auto; min-width: 0; display: grid; gap: 14px; align-content: start; }
.pos-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pos-bar .search { max-width: 360px; }
.cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.cats button { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; height: 40px; padding: 0 18px; font-weight: 600; font-size: 14.5px; white-space: nowrap; color: var(--ink); flex: none; }
.cats button:hover { background: var(--fill); }
.cats button.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.catbtn { display: inline-flex; align-items: center; gap: 6px; }
.catbtn svg { width: 16px; height: 16px; }
.catbtn .mv { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--fill); color: var(--ink); font-weight: 700; }
.catbtn .grip { width: 20px; height: 20px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 10px; }
.tile { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; min-height: 104px; border-radius: var(--r); border: 1px solid var(--line); text-align: start; color: var(--ink); background: var(--bg); overflow: hidden; }
.tile::before { content: ''; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 4px; background: var(--tone, var(--brand)); }
.tile:hover { border-color: var(--line-2); background: var(--bg-2); }
.tile:active { transform: scale(.985); }
.tile .tile-hit { position: absolute; inset: 0; border: 0; background: transparent; border-radius: var(--r); z-index: 1; }
.tile .tile-hit:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
.tile > .nm { padding: 12px 14px 0; font-weight: 700; font-size: 15px; line-height: 1.35; position: relative; pointer-events: none; padding-inline-end: 40px; }
.tile .tile-f { padding: 0 14px 12px; position: relative; pointer-events: none; display: flex; align-items: center; gap: 6px; }
.tile .pr { font-size: 16px; font-weight: 700; }
.tile .tile-opt { position: absolute; top: 8px; inset-inline-end: 8px; z-index: 2; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; color: var(--ink-2); }
.tile .tile-opt:hover { color: var(--ink); border-color: var(--line-2); }
.tile .tile-opt svg { width: 16px; height: 16px; }
.tile.out, .tile.stopped { opacity: .5; }
.tile.out .pr { text-decoration: line-through; }
.tile.edit { justify-content: flex-start; gap: 8px; padding: 10px 12px 10px 14px; }
.tile.edit .nm { padding: 0; }
.tile.edit.dropto { outline: 2px solid var(--brand); }
.tiles.t-s { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); } .tiles.t-s .tile { min-height: 84px; } .tiles.t-s .nm { font-size: 14px; }
.tiles.t-l { grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); } .tiles.t-l .tile { min-height: 136px; } .tiles.t-l .nm { font-size: 17px; }
.ticket { border-inline-start: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--bg); position: sticky; top: 0; height: 100vh; }
.ticket-h { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.ticket-h .seg button { height: 38px; font-size: 15px; padding: 0 8px; }
.ticket-h .seg.sm button { height: 30px; font-size: 13px; }
.ticket-h .row.nw > .custbtn, .ticket-h .row.nw > input, .ticket-h .row.nw > .cust-line, .ticket-h .app-row > select { flex: 1; min-width: 0; }
.ticket-h .app-row > input { flex: 1; min-width: 0; max-width: 46%; }
.cust-line { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cust-line svg { width: 15px; height: 15px; flex: none; }
.ticket-h select { width: auto; flex: 0 0 132px; }
.ticket-b { flex: 1; overflow-y: auto; padding: 0 16px; }
.ticket-f { padding: 14px 16px 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; background: var(--bg); }
.ticket-tools { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.custbtn { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; height: var(--h); padding: 0 12px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--bg); text-align: start; color: var(--ink-2); font-size: 14.5px; }
.custbtn:hover { background: var(--fill); }
.custbtn.set { color: var(--ink); font-weight: 600; border-color: var(--brand-line); background: var(--brand-soft); }
.custbtn svg { width: 18px; height: 18px; flex: none; color: var(--ink-2); }
.custbtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.line:last-child { border-bottom: 0; }
.line.on { background: var(--brand-soft); margin-inline: -16px; padding-inline: 16px; }
.line.short { box-shadow: inset 3px 0 0 var(--bad-fill); }
.line .q { width: 30px; height: 30px; border-radius: 8px; background: var(--fill); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.line-main { border: 0; background: none; text-align: start; padding: 0; display: grid; gap: 2px; color: inherit; min-width: 0; }
.line .nm { font-weight: 600; }
.line .md { font-size: 13px; color: var(--ink-2); }
.line .lp { font-weight: 700; }
.line .ctr { grid-column: 1 / 4; display: flex; gap: 6px; align-items: center; }
.line .ctr > button:not(.txt) { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg); font-size: 18px; line-height: 1; }
.line .ctr b { min-width: 24px; text-align: center; }
.line .ctr .txt { height: 32px; border: 0; background: none; font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 6px; }
.line .ctr .txt:hover { background: var(--fill); color: var(--ink); }
.line .ctr .txt svg { width: 15px; height: 15px; }
.line .ctr .txt.bad-t { color: var(--bad); }
.cbx { width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--line-2); background: var(--bg); }
.cbx.on { background: var(--brand); border-color: var(--brand); }
.lnote { display: flex; gap: 6px; align-items: flex-start; font-size: 13px; color: var(--ink); background: var(--warn-soft); border-radius: 6px; padding: 3px 8px; margin-top: 4px; font-weight: 600; }
.lnote svg { width: 14px; height: 14px; flex: none; margin-top: 3px; color: var(--warn); }
.undo { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; margin: 10px 0; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 14px; }
.undo .btn { background: color-mix(in srgb, var(--bg) 16%, transparent); border-color: transparent; color: var(--bg); }
.sumrow { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--ink-2); }
.sumrow.tot { font-size: 19px; color: var(--ink); font-weight: 700; padding-top: 2px; }
.ticket-f > .btn.xl { width: 100%; justify-self: stretch; }
.tenders.four, .tenders.n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tenders.n5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tenders.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tender[aria-pressed="true"]::after { content: '✓'; font-size: 12px; }
.scanbox { display: grid; gap: 8px; justify-items: center; padding: 10px; border: 1px dashed var(--line-2); border-radius: var(--r); }
.scanbox video { width: 100%; max-width: 360px; aspect-ratio: 4 / 3; border-radius: var(--r-sm); background: #000; object-fit: cover; }
.filebtn.sm { height: var(--h-sm); font-size: 13.5px; }
/* Preparation cards: one material, its quantity in its unit, and the action, readable on a phone. */
.prep-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.prep-card { border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); padding: 14px 16px; display: grid; gap: 8px; }
.prep-card.low { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.prep-card .pc-h { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.prep-card .pc-q { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.prep-card .pc-q span { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.prep-card .pc-q svg { width: 16px; height: 16px; }
.prep-card .pc-q b { font-size: 18px; }
.prep-card .pc-q.small b { font-size: 14px; font-weight: 600; }
.prep-card .pc-f { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
/* Counting: the quantity and its unit in one box. */
.cnt-f .affix select { border: 0; border-inline-start: 1px solid var(--line); border-radius: 0; height: 100%; max-width: 46%; background: var(--fill); padding: 0 8px; }
.more-d { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 0 14px; }
.more-d summary { cursor: pointer; min-height: var(--h); display: flex; align-items: center; font-weight: 600; color: var(--ink-2); }
.more-d[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.more-d > :last-child { margin-bottom: 12px; }
tr.grp td { background: var(--fill); font-weight: 600; }
.btn.ib.danger-t { color: var(--bad); }
.shift-gate { max-width: 460px; margin: 60px auto; }
.cart-fab { display: none; }
.cart-fab[hidden] { display: none !important; }
.quickopts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.qopt { min-height: 76px; border-radius: var(--r); border: 2px solid var(--line); background: var(--bg); display: grid; gap: 4px; place-items: center; padding: 8px; font-size: 16px; }
.qopt:hover { border-color: var(--brand); } .qopt.out { opacity: .5; }
.grp { display: grid; gap: 8px; }
.grp-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chips-q { display: flex; flex-wrap: wrap; gap: 6px; }
.chips-q button { border: 1px solid var(--line-2); background: var(--bg); color: var(--ink); border-radius: 99px; height: 34px; padding: 0 12px; font-size: 13.5px; font-weight: 500; }
.chips-q button:hover { background: var(--fill); }
.qtyctl { display: inline-flex; align-items: center; gap: 12px; }
.qtyctl button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg); font-size: 22px; }
.qtyctl b { min-width: 24px; text-align: center; font-size: 18px; }
.qtyctl.sm button { width: 32px; height: 32px; font-size: 16px; }

/* Payment */
.big-total { text-align: center; padding: 4px 0 0; display: grid; gap: 2px; }
.big-total .v { font-size: 40px; font-weight: 700; line-height: 1.15; }
.tenders { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tender { min-height: 72px; border-radius: var(--r); border: 2px solid var(--line); background: var(--bg); font-weight: 700; font-size: 15.5px; display: grid; place-items: center; gap: 4px; padding: 8px; }
.tender svg { width: 22px; height: 22px; }
.tender:hover { border-color: var(--line-2); }
.tender.on { border-color: var(--brand); background: var(--brand-soft); }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.quick button { height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); font-weight: 700; font-size: 16px; }
.quick button:hover { background: var(--fill); }
.change { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; background: var(--good-soft); color: var(--good); }
.change span { font-weight: 600; }
.change b { font-size: 26px; }
.change.big b { font-size: 32px; }
.change.plain { background: var(--bg-2); color: var(--ink); }
.done { text-align: center; display: grid; gap: 12px; justify-items: center; padding: 6px 0; }
.done .ok { width: 68px; height: 68px; border-radius: 50%; background: var(--good-fill); color: #fff; display: grid; place-items: center; }
.done .ok svg { width: 36px; height: 36px; }
.done h2 { font-size: 26px; }
.done .change { width: 100%; }

/* ---------- Orders ---------- */
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; align-items: start; }
.bcol { display: grid; gap: 10px; align-content: start; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; min-height: 120px; }
.bcol h3 { font-size: 14.5px; display: flex; gap: 8px; align-items: center; padding: 4px 6px; }
.bcol .empty { padding: 20px 8px; font-size: 13.5px; }
.ocard { display: grid; gap: 8px; padding: 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); box-shadow: var(--shadow-1); }
.ocard-h { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; text-align: start; color: inherit; width: 100%; }
.ocard .no { font-size: 17px; font-weight: 700; }
.ocard .items { font-size: 14px; color: var(--ink); }
.ocard .meta { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.ocard .acts { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 2px; }
.ocard.hot { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.ocard.late { border-color: var(--bad-fill); box-shadow: inset 0 0 0 1px var(--bad-fill); }
.olines { display: grid; }
.oline { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.oline:last-child { border-bottom: 0; }
.oline .q { width: 26px; height: 26px; border-radius: 7px; background: var(--fill); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.oline .md { font-size: 13px; color: var(--ink-2); }
.oline.void { opacity: .45; text-decoration: line-through; }
.timeline { display: grid; }
.timeline > div { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.timeline > div:last-child { border-bottom: 0; }
.timeline time { color: var(--ink-3); font-family: var(--f-mono); font-size: 12.5px; direction: ltr; text-align: end; }

/* ---------- Paper tickets ---------- */
.printers { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; align-items: start; }
.roll { background: var(--bg-2); border-radius: 10px; padding: 12px; display: grid; gap: 14px; max-height: 620px; overflow-y: auto; }
.paper-wrap { display: grid; gap: 8px; }
.paper-wrap > .row { justify-content: space-between; }
.paper { background: var(--paper); color: var(--paper-ink); width: 100%; max-width: 280px; margin-inline: auto; padding: 14px 14px 18px; font-size: 14px; line-height: 1.45; box-shadow: 0 1px 3px rgba(0, 0, 0, .18); position: relative;
  -webkit-mask: radial-gradient(circle 5px at 50% 100%, transparent 98%, #000) 0 0 / 12px 100% repeat-x; mask: radial-gradient(circle 5px at 50% 100%, transparent 98%, #000) 0 0 / 12px 100% repeat-x; }
.paper .ph { display: flex; justify-content: space-between; font-size: 12px; color: #555; }
.paper .pno { font-size: 30px; font-weight: 700; text-align: center; letter-spacing: 1px; margin: 4px 0; direction: ltr; }
.paper .ptype { text-align: center; font-size: 18px; font-weight: 700; padding: 2px 0; border: 2px solid #111; border-radius: 4px; }
.paper .ptype.inv { background: #111; color: #fff; }
.paper hr { border: 0; border-top: 1.5px dashed #777; margin: 8px 0; }
.paper .pl { display: grid; grid-template-columns: 34px 1fr; gap: 2px 6px; font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.paper .pl small { grid-column: 2; font-size: 15px; font-weight: 800; }
.paper .pl .from { grid-column: 2; font-size: 12.5px; font-weight: 500; color: #555; }
.paper .pl .pn { grid-column: 2; font-style: normal; font-size: 15px; font-weight: 800; border: 1.5px solid #111; border-radius: 4px; padding: 0 6px; margin-top: 2px; }
.paper .r { display: flex; justify-content: space-between; gap: 8px; }
.paper .c { text-align: center; }
.paper .stamp { text-align: center; font-weight: 700; font-size: 13px; margin-top: 6px; }
.paper.wait { opacity: .6; }
.jl { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px 12px; font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }

/* ---------- Figures ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpis:not(:has(> :nth-child(4))) { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpis:not(:has(> :nth-child(3))) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kpis:has(> :nth-child(5)):not(:has(> :nth-child(7))) { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpi { padding: 16px; border: 1px solid var(--line); border-radius: var(--r); display: grid; gap: 6px; align-content: start; background: var(--bg); min-width: 0; }
.kpi .l { font-size: 13.5px; color: var(--ink-2); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.kpi .v { font-size: 26px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
.kpi .v small { font-size: 15px; font-weight: 600; color: var(--ink-2); }
.kpi .d { font-size: 13px; color: var(--ink-2); }
.kpi.hero .v { font-size: 30px; }
.kpi.click { cursor: pointer; transition: border-color .12s, box-shadow .12s; }
.kpi.click:hover { border-color: var(--brand-line); box-shadow: var(--shadow-1); }
.kpi .info { border: 0; background: none; padding: 0; width: 18px; height: 18px; color: var(--ink-3); display: inline-grid; place-items: center; }
.kpi .info:hover { color: var(--ink); }
.kpi .info svg { width: 15px; height: 15px; }
.kpi .tag { margin-inline-start: auto; }
.up { color: var(--good); } .down { color: var(--bad); }
.spark { width: 100%; height: 30px; margin-top: 2px; }
.chart svg { width: 100%; height: auto; display: block; direction: ltr; }
.chart text { font-family: var(--f); }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; }
.stack100 + .legend { margin-top: 10px; }
.hb { display: grid; gap: 4px; }
.hb-row { display: grid; grid-template-columns: minmax(96px, 150px) minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 14px; padding: 5px 6px; border-radius: 6px; }
.hb-row .bar { height: 10px; border-radius: 4px 0 0 4px; background: var(--chart-1); min-width: 2px; }
.hb-row .bar.muted { background: var(--chart-muted); }
.hb-row .val { font-weight: 600; min-width: 64px; text-align: end; font-variant-numeric: tabular-nums; }
.hb-row[role=button] { cursor: pointer; } .hb-row[role=button]:hover { background: var(--bg-2); }
.hb-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stack100 { display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--bg); }
.stack100 > i { display: block; height: 100%; }
.attn-list { display: grid; gap: 8px; }
.attn { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--bg-2); border: 1px solid transparent; }
button.attn { width: 100%; text-align: start; color: inherit; }
button.attn:hover { background: var(--fill); }
.attn .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--warn-soft); color: var(--warn); }
.attn.bad .ic { background: var(--bad-soft); color: var(--bad); }
.attn.brand .ic { background: var(--brand-soft); color: var(--brand); }
.attn.good .ic { background: var(--good-soft); color: var(--good); }
.attn .ic svg { width: 18px; height: 18px; }
.attn > div:not(.ic) { flex: 1; min-width: 0; display: grid; gap: 1px; }
.attn b { font-size: 14.5px; font-weight: 600; }
.attn span { font-size: 13px; color: var(--ink-2); }
.attn .go { width: 16px; height: 16px; color: var(--ink-3); flex: none; }
.big-n { font-size: 36px; font-weight: 700; line-height: 1; }
.wfl { display: grid; }
.wf { display: grid; grid-template-columns: minmax(140px, 1.2fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 7px 8px; font-size: 14px; border-radius: 6px; }
.wf.sub span:first-child { padding-inline-start: 16px; color: var(--ink-2); }
.wf .wfbar { height: 8px; overflow: hidden; }
.wf .wfbar i { display: block; height: 100%; border-radius: 4px 0 0 4px; background: var(--chart-muted); }
.wf.in .wfbar i, .wf.tot .wfbar i { background: var(--chart-1); opacity: .45; }
.wf.net .wfbar i { background: var(--chart-1); }
.wf.tot, .wf.net { font-weight: 700; border-top: 1px solid var(--line); border-radius: 0; margin-top: 2px; padding-top: 10px; }
.wf.net { font-size: 16px; border-top: 2px solid var(--ink); }
.wf b { font-variant-numeric: tabular-nums; min-width: 96px; text-align: end; }
.wf[role=button] { cursor: pointer; } .wf[role=button]:hover { background: var(--bg-2); }

/* ---------- Customizing ---------- */
.wgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
.w > details.card { height: 100%; }
.w { min-width: 0; position: relative; display: grid; }
.w > .card { height: 100%; }
.w3 { grid-column: span 3; } .w4 { grid-column: span 4; } .w6 { grid-column: span 6; } .w8 { grid-column: span 8; } .w12 { grid-column: span 12; }
.wgrid.editing .w { outline: 2px dashed var(--line-2); outline-offset: 4px; border-radius: var(--r); }
.wgrid.editing .w:focus-visible { outline: 2px solid var(--brand); }
.w.dropto { outline-color: var(--brand) !important; outline-style: solid !important; }
.w.dragging, .dragging { opacity: .45; }
.wtools { display: flex; align-items: center; gap: 6px; padding: 6px 8px; margin-bottom: 8px; border-radius: 10px; background: var(--brand-soft); }
.wtools b { font-size: 14px; }
.wbody { pointer-events: none; user-select: none; }
.grip { cursor: grab; display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--ink-2); }
.grip:active { cursor: grabbing; } .grip svg { width: 18px; height: 18px; }
.editbar { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; padding: 12px 14px; border-radius: var(--r); background: var(--brand-soft); border: 1px solid var(--brand-line); }
.editbar b { display: inline-flex; gap: 6px; align-items: center; } .editbar b svg { width: 18px; height: 18px; }
.editbar .small { flex: 1 1 260px; }
.hiddenbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hiddenbar .chip { height: var(--h-sm); }

/* ---------- Date range ---------- */
.rangebar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.rangebar input[type=date], .rangebar select { width: auto; }
.rng-now { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--ink-2); }
.rng-now svg { width: 16px; height: 16px; }

/* ---------- Overlays ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .45); z-index: 50; display: grid; place-items: center; padding: 16px; }
#modal .scrim { z-index: 80; }
#drawer .scrim { z-index: 55; background: rgba(10, 14, 20, .3); }
.modal { width: min(560px, 100%); max-height: calc(100vh - 32px); background: var(--bg); border-radius: var(--r-lg); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.modal.wide { width: min(840px, 100%); }
.modal.narrow { width: min(420px, 100%); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 14px 20px; border-bottom: 1px solid var(--line); min-height: 64px; }
.modal-h h3 { font-size: 18px; font-weight: 700; min-width: 0; flex: 1; display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; }
.modal-b { padding: 20px; overflow-y: auto; display: grid; grid-template-columns: minmax(0, 1fr); grid-auto-rows: max-content; gap: 16px; align-content: start; }
.modal-f { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--bg); }
.drawer { position: fixed; top: 0; bottom: 0; inset-inline-end: 0; width: min(560px, 100%); z-index: 60; background: var(--bg); box-shadow: var(--shadow); display: flex; flex-direction: column; }
.drawer.wide { width: min(780px, 100%); }
.drawer .modal-b { flex: 1; }
.dsub { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); }
.opts { display: grid; gap: 8px; }
.opts.tall { max-height: 320px; overflow-y: auto; }
.opt { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); text-align: start; width: 100%; }
button.opt:hover { border-color: var(--line-2); background: var(--bg-2); }
.opt .cb { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line-2); flex: none; display: grid; place-items: center; }
.opt.on { border-color: var(--brand); background: var(--brand-soft); }
.opt.on .cb { background: var(--brand); border-color: var(--brand); }
.opt.on .cb::after { content: ''; width: 10px; height: 6px; border: 2.5px solid var(--brand-ink); border-top: 0; border-inline-end: 0; transform: rotate(-45deg) translate(-1px, -1px) scaleX(-1); }
.opt .p { margin-inline-start: auto; color: var(--ink-2); font-weight: 600; }
.opt[disabled] { opacity: .5; }
.opt > svg { width: 18px; height: 18px; color: var(--ink-2); flex: none; }
.more-list { display: grid; gap: 8px; }
.more-list .btn { justify-content: flex-start; width: 100%; height: var(--h-lg); }
.help-steps { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.help-steps li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; counter-increment: s; font-size: 14.5px; }
.help-steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 700; font-size: 13.5px; }
.toasts { position: fixed; z-index: 90; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: grid; gap: 8px; width: max-content; max-width: min(440px, calc(100% - 32px)); justify-items: center; pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 10px; box-shadow: var(--shadow); font-size: 14px; display: flex; gap: 10px; align-items: center; }
.toast i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--good-fill); }
.toast.bad i { background: #FF5C70; } .toast.warn i { background: var(--warn-fill); }

/* ---------- Settings ---------- */
.set { display: grid; grid-template-columns: 228px minmax(0, 1fr); gap: 24px; align-items: start; }
.set-nav { display: grid; gap: 2px; position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; }
.set-nav h6 { margin: 14px 12px 4px; font-size: 12px; color: var(--ink-3); font-weight: 600; }
.set-nav h6:first-child { margin-top: 0; }
.set-nav button { text-align: start; border: 0; background: none; height: 38px; padding: 0 12px; border-radius: var(--r-sm); font-weight: 500; font-size: 14.5px; color: var(--ink-2); white-space: nowrap; flex: none; }
.set-nav button:hover { background: var(--fill); color: var(--ink); }
.set-nav button.on { background: var(--fill); color: var(--ink); font-weight: 700; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 40px; height: 40px; border-radius: 10px; border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--line-2); }
.swatch.on { box-shadow: 0 0 0 3px var(--ink); }
.mlines { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.mline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mline > select { flex: 2 1 180px; width: auto; }
.mline > input[type=text], .mline > input[type=date] { flex: 1 1 110px; width: auto; }
.mline > .mono, .mline > .tag { min-width: 40px; }
.countgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.formgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 14px 16px; align-items: start; }
.box { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }

/* ---------- Customer site ---------- */
.site { min-height: 100%; background: var(--bg-2); }
.site-in { max-width: 560px; margin: 0 auto; background: var(--bg); min-height: 100vh; position: relative; padding-bottom: 96px; box-shadow: 0 0 0 1px var(--line); }
.site-hero { padding: 18px 16px 0; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.site-hero .logo { width: 56px; height: 56px; font-size: 26px; border-radius: 16px; }
.site-hero h1 { font-size: 22px; line-height: 1.2; }
.site-hero .row.wrap { flex-wrap: wrap; row-gap: 4px; }
.site-nav { display: flex; gap: 2px; margin: 4px -16px 0; padding: 0 10px; overflow-x: auto; scrollbar-width: none; }
.site-nav button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 10px 10px 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.site-nav button svg { width: 18px; height: 18px; }
.site-nav button.on { color: var(--brand); border-bottom-color: var(--brand); }
.site-body { display: block; }
.site-cartpanel { display: none; }
.site-tools { padding: 12px 16px 0; }
.site-tools .search { position: relative; }
.site-tools .search svg { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-3); }
.site-tools .search input { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); padding-inline-start: 40px; padding-inline-end: 40px; background: var(--bg-2); font-size: 15px; }
.site-tools .search .x { position: absolute; inset-inline-end: 8px; top: 50%; transform: translateY(-50%); }
.site-cats { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 16px; display: flex; gap: 8px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.site-cats button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); border-radius: 99px; height: 36px; padding: 0 14px; font-weight: 600; white-space: nowrap; flex: none; }
.site-cats button.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.site-sec { padding: 8px 16px 4px; display: grid; gap: 4px; }
.site-sec h2 { font-size: 18px; margin: 14px 0 6px; }
.site-sec > .stack, .site-sec.stack { gap: 14px; }
.dishes { display: grid; gap: 10px; }
.dish { position: relative; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); align-items: stretch; }
.dish .dish-hit { position: absolute; inset: 0; border: 0; background: transparent; border-radius: 16px; z-index: 1; cursor: pointer; }
.dish .dish-hit:focus-visible { outline: 2px solid var(--brand); }
.dish:hover { border-color: var(--line-2); }
.dish .pic { width: 92px; height: 92px; border-radius: 12px; object-fit: cover; display: grid; place-items: center; font-weight: 700; font-size: 30px; background: color-mix(in srgb, var(--tone, var(--brand)) 13%, var(--bg)); color: var(--tone, var(--brand)); pointer-events: none; }
.dish-b { display: flex; flex-direction: column; gap: 2px; min-width: 0; pointer-events: none; }
.dish .nm { font-weight: 700; font-size: 16px; }
.dish .ds { font-size: 13.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dish .pr { font-weight: 700; font-size: 15px; }
.dish-b > .row { margin-top: auto; }
.dish .add, .dish .ctr, .dish .pill { position: relative; z-index: 2; pointer-events: auto; }
.dish .add { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0, 106, 255, .25); }
.dish .add svg { width: 20px; height: 20px; }
.dish.out { opacity: .6; }
.site .ctr { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; height: 36px; background: var(--bg); }
.site .ctr button { width: 36px; height: 36px; border: 0; background: var(--bg-2); font-size: 20px; line-height: 1; color: var(--ink); display: grid; place-items: center; }
.site .ctr button svg { width: 16px; height: 16px; }

<script>
/* Revo engine v5 : pure business rules, no DOM, deterministic.
   Money: integer dirhams (1 LYD = 1000). Quantities: base units (g, ml, pc).
   Every change goes through E.exec(): atomic, idempotent, permission-checked, audited. */
(function (root) {
  'use strict';
  const E = {};
  const VERSION = 6;
  E.VERSION = VERSION;

  /* ---------- Errors ---------- */
  class EngineError extends Error {
    constructor(code, message, data) { super(message); this.code = code; this.data = data || null; }
  }
  const fail = (code, message, data) => { throw new EngineError(code, message, data); };
  const must = (cond, code, message, data) => { if (!cond) fail(code, message, data); };
  E.EngineError = EngineError;

  /* ---------- Money ---------- */
  // Round half away from zero, the one rounding rule used everywhere.
  const rnd = x => (x < 0 ? -Math.round(-x) : Math.round(x));
  const D = lyd => rnd(lyd * 1000);                       // LYD -> dirhams
  const pctOf = (amount, rate) => rnd(amount * rate / 100); // rate in percent, up to 2 decimals
  const AR_DIGITS = { '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9', '٫': '.', '،': ',' };
  const normDigits = s => String(s == null ? '' : s).replace(/[٠-٩٫،]/g, ch => AR_DIGITS[ch]).trim();
  // Parse a money string typed in LYD ("12.5", "١٢٫٥", "12,5") into dirhams; max 3 decimals.
  function parseMoney(v, opts) {
    opts = opts || {};
    if (typeof v === 'number') { must(Number.isFinite(v), 'invalid_amount', 'المبلغ غير صحيح'); const n = D(v); if (!opts.allowNegative) must(n >= 0, 'invalid_amount', 'لا يمكن أن يكون المبلغ سالبًا'); return n; }
    const t = normDigits(v).replace(',', '.');
    if (t === '' && opts.allowEmpty) return null;
    must(/^-?\d+(\.\d{1,3})?$/.test(t), 'invalid_amount', 'المبلغ غير صحيح، حتى ثلاثة أرقام بعد الفاصلة');
    const n = D(Number(t));
    if (!opts.allowNegative) must(n >= 0, 'invalid_amount', 'لا يمكن أن يكون المبلغ سالبًا');
    return n;
  }
  const isMoney = v => Number.isInteger(v);
  const assertMoney = (v, label, allowZero) => {
    must(Number.isInteger(v), 'invalid_amount', (label || 'المبلغ') + ' غير صحيح');
    must(allowZero ? v >= 0 : v > 0, 'invalid_amount', (label || 'المبلغ') + (allowZero ? ' لا يمكن أن يكون سالبًا' : ' يجب أن يكون أكبر من صفر'));
  };
  const assertPct = (v, label) => must(typeof v === 'number' && Number.isFinite(v) && v >= 0 && v <= 100 && rnd(v * 100) === v * 100,
    'invalid_pct', (label || 'النسبة') + ' بين 0 و100، وحتى رقمين بعد الفاصلة');
  const f3 = d => (d / 1000).toFixed(3).replace(/\.?0+$/, '');
  Object.assign(E, { rnd, D, pctOf, parseMoney, isMoney, normDigits, f3 });

  /* ---------- Time: Libya, UTC+2 all year ---------- */
  const TZ = 2 * 3600000, DAY = 86400000;
  const dayStartMs = s => ((s && s.settings && s.settings.time ? s.settings.time.dayStartMin : 300) || 0) * 60000;
  // Business day of a timestamp: the local date after shifting by the day-start hour (orders at 01:30 belong to yesterday when the day starts at 05:00).
  const bday = (s, ts) => new Date(ts + TZ - dayStartMs(s)).toISOString().slice(0, 10);
  const dayStart = (s, key) => Date.parse(key + 'T00:00:00Z') - TZ + dayStartMs(s);
  const dayEnd = (s, key) => dayStart(s, key) + DAY;
  const addDays = (key, n) => new Date(Date.parse(key + 'T12:00:00Z') + n * DAY).toISOString().slice(0, 10);
  const dowOf = key => new Date(key + 'T12:00:00Z').getUTCDay(); // 0 = Sunday
  const monthOf = key => key.slice(0, 7);
  const daysInMonth = key => new Date(Date.UTC(Number(key.slice(0, 4)), Number(key.slice(5, 7)), 0)).getUTCDate();
  const localHour = ts => new Date(ts + TZ).getUTCHours();
  const localMin = ts => new Date(ts + TZ).getUTCMinutes();
  const localDate = ts => new Date(ts + TZ).toISOString().slice(0, 10);
  // A real calendar date only: 2026-02-31 is refused, not silently moved to March.
  const keyValid = k => { if (typeof k !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(k)) return false; const t = Date.parse(k + 'T00:00:00Z'); return !isNaN(t) && new Date(t).toISOString().slice(0, 10) === k; };
  // Date-range presets used by every list and report. Week starts on settings.time.weekStart (0 = Sunday, 6 = Saturday).
  function rangeOf(s, preset, now, custom) {
    const today = bday(s, now);
    const ws = s && s.settings && s.settings.time ? s.settings.time.weekStart : 6;
    switch (preset) {
      case 'today': return { from: today, to: today, preset };
      case 'yesterday': { const y = addDays(today, -1); return { from: y, to: y, preset }; }
      case 'week': { const back = (dowOf(today) - ws + 7) % 7; return { from: addDays(today, -back), to: today, preset }; }
      case 'month': return { from: today.slice(0, 8) + '01', to: today, preset };
      case 'lastmonth': { const first = today.slice(0, 8) + '01', prevLast = addDays(first, -1); return { from: prevLast.slice(0, 8) + '01', to: prevLast, preset }; }
      case 'last7': return { from: addDays(today, -6), to: today, preset };
      case 'last30': return { from: addDays(today, -29), to: today, preset };
      case 'all': { let first = today; if (s && Array.isArray(s.journal)) for (const j of s.journal) if (j.date && j.date < first) first = j.date; return { from: first, to: today, preset }; }
      case 'custom': {
        const c = custom || {};
        must(keyValid(c.from) && keyValid(c.to), 'invalid_range', 'اختر تاريخ البداية والنهاية');
        must(c.from <= c.to, 'invalid_range', 'تاريخ النهاية يجب أن يكون بعد تاريخ البداية أو في اليوم نفسه');
        return { from: c.from, to: c.to, preset, hFrom: c.hFrom, hTo: c.hTo };
      }
      default: return { from: today, to: today, preset: 'today' };
    }
  }
  const inRange = (key, r) => !r || (key >= r.from && key <= r.to);
  // Optional hour filter (local clock hours, hFrom inclusive, hTo exclusive; wraps past midnight).
  const inHours = (ts, r) => {
    if (!r || r.hFrom == null || r.hTo == null || r.hFrom === r.hTo) return true;
    const h = localHour(ts);
    return r.hFrom < r.hTo ? h >= r.hFrom && h < r.hTo : h >= r.hFrom || h < r.hTo;
  };
  const daysBetween = (a, b) => Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / DAY);

  def('partner.rename', { label: 'اسم شريك', perm: 'settings', run(s, a, ctx) { const p = partnerOf(s, a.id); must(text(a.name), 'bad_name', 'اكتب الاسم'); p.name = text(a.name, 40); s.accounts[p.cap].name = 'رأس مال ' + p.name; s.accounts[p.cur].name = 'جاري ' + p.name; return { ok: true }; } });
  // Paying out is separate from the daily distribution: it only moves money the partner already has in his current account.
  def('partner.withdraw', {

  /* ---------- Equipment: who funded it, who owns it, who bears its cost ---------- */
  // bearer 'operations': the price is an asset spread over its life (depreciation), never an expense at purchase.

  def('asset.add', {
    label: 'معدة جديدة', perm: 'maintenance', backdatable: true,
    run(s, a, ctx) {
      must(text(a.name), 'bad_name', 'اكتب اسم المعدة'); assertMoney(a.cost, 'سعر الشراء');
      must(['restaurant', 'partner'].includes(a.funder), 'bad_value', 'اختر من موّل الشراء');

      must(['operations', 'partner'].includes(a.bearer), 'bad_value', 'اختر من يتحمل التكلفة');
      must(!(a.bearer === 'operations' && a.owner === 'partner'), 'bad_value', 'معدة يملكها الشريك لا تُهلك على التشغيل');
      const top = topPartner(s, ctx.date);
      const fp = a.funder === 'partner' ? partnerOf(s, a.funderPid || top.id) : null;
      const life = a.bearer === 'operations' ? (Number.isInteger(a.life) && a.life > 0 ? a.life : s.settings.finance.assetLife) : null;
      const x = { id: nextId(s, 'AS', 3), name: text(a.name, 60), cost: a.cost, at: ctx.at, date: ctx.date, funder: a.funder, funderPid: fp ? fp.id : null, owner: a.owner,
        ownerPid: a.owner === 'partner' ? top.id : null, bearer: a.bearer, bearerPid: a.bearer === 'partner' ? top.id : null, life, capitalized: a.bearer === 'operations', dep: 0,
        by: ctx.user.id, note: text(a.note, 120), from: a.funder === 'restaurant' ? a.from : null };
      let lines = null;
      if (a.funder === 'restaurant') {
        const src = fundSource(s, ctx, a.from, a.cost);
        lines = [a.bearer === 'operations' ? { a: '1500', d: a.cost, p: 'ast:' + x.id } : { a: top.cur, d: a.cost }, { a: src.acc, c: a.cost, p: src.party }];
        post(s, ctx, { memo: (a.bearer === 'operations' ? 'شراء معدة للمطعم: ' : 'معدة على حصة ' + top.name + ': ') + x.name, src: { t: 'ast', id: x.id }, lines });
        src.after && src.after(a.cost, 'معدة ' + x.name);
      } else if (a.bearer === 'operations') {

        post(s, ctx, { memo: 'معدة للمطعم دفعها ' + fp.name + ': ' + x.name, src: { t: 'ast', id: x.id }, lines: [{ a: '1500', d: a.cost, p: 'ast:' + x.id }, { a: fp.cur, c: a.cost }] });
      } // partner funded and partner bears it: recorded in the register only, no money moved in the restaurant's books.

  // Equipment that existed before the system: cost and depreciation so far, against opening balances.
  def('asset.opening', {
    label: 'معدة موجودة قبل النظام', perm: 'settings',
    run(s, a, ctx) {
      must(text(a.name), 'bad_name', 'اكتب اسم المعدة'); assertMoney(a.cost, 'سعر الشراء'); assertMoney(a.depSoFar || 0, 'الإهلاك السابق', true);
      must((a.depSoFar || 0) <= a.cost, 'bad_value', 'الإهلاك السابق أكبر من السعر');
      const life = Number.isInteger(a.life) && a.life > 0 ? a.life : s.settings.finance.assetLife;
      const x = { id: nextId(s, 'AS', 3), name: text(a.name, 60), cost: a.cost, at: ctx.at, date: a.boughtOn && keyValid(a.boughtOn) ? a.boughtOn : ctx.date, funder: 'restaurant', owner: 'restaurant', bearer: 'operations',
        life, capitalized: true, dep: a.depSoFar || 0, opening: true, by: ctx.user.id, note: 'موجودة قبل النظام' };
      post(s, ctx, { memo: 'معدة موجودة قبل النظام: ' + x.name, src: { t: 'ast', id: x.id }, lines: [{ a: '1500', d: a.cost, p: 'ast:' + x.id }, { a: '1590', c: x.dep, p: 'ast:' + x.id }, { a: '3000', c: a.cost - x.dep }] });
      s.assets.push(x); ctx.ref = x.id; return { id: x.id };
    },
  });
  // Monthly depreciation of an asset spread over the days of each month, never above its cost.
  function depFor(x, key) {
    if (!x.capitalized || key < x.date || x.dep >= x.cost) return 0;
    return Math.min(x.cost - x.dep, dayShare(rnd(x.cost / x.life), key));
  }
  def('maint.open', {
    label: 'تسجيل عطل', perm: 'maintenance',
    run(s, a, ctx) {
      must(text(a.issue), 'bad_value', 'اكتب وصف العطل');
      const j = { id: nextId(s, 'MT', 4), at: ctx.at, assetId: a.assetId || null, asset: a.assetId ? (s.assets.find(x => x.id === a.assetId) || {}).name : text(a.asset, 60), issue: text(a.issue, 140), urgent: !!a.urgent, status: 'open', by: ctx.user.id };
      s.maint.push(j); ctx.ref = j.id; ctx.note = (j.asset || '') + ': ' + j.issue; return { id: j.id };
    },
  });
  // Fixing and paying is one step: the accountant decides operating expense or the largest partner's share.
  def('maint.finish', {
    label: 'إصلاح ودفع', perm: 'maintenance', backdatable: true,
    run(s, a, ctx) {
      const j = s.maint.find(x => x.id === a.id); must(j && j.status === 'open', 'bad_state', 'العطل غير مفتوح');
      assertMoney(a.cost, 'التكلفة', true);

      ctx.ref = j.id; ctx.note = f3(a.cost) + ' · ' + (chargeTo === 'partner' ? 'حصة الشريك الأكبر' : 'مصروف تشغيل'); return { id: j.id };
    },
  });

  /* ---------- Day close: accrue, depreciate, distribute, lock ---------- */
  // At day close only wages (earned day by day) and equipment depreciation are charged; rent and bills are expenses when paid.
  function accruals(s, key) {
    const out = [];
    s.employees.forEach(e => { const w = wageFor(s, e, key); if (w) out.push({ k: 'wage', emp: e.id, name: e.name, amount: w }); });
    s.assets.forEach(x => { const d = depFor(x, key); if (d) out.push({ k: 'dep', asset: x.id, name: x.name, amount: d }); });
    return out;
  }
  E.accrualsFor = accruals;
  // Allocate a day's result to partners by the shares in force that day; the last partner takes the rounding remainder.
  function allocate(s, net, key) {
    const ps = s.settings.partners; let rest = net;
    return ps.map((p, i) => { const pct = shareAt(p, key); const amt = i === ps.length - 1 ? rest : rnd(net * pct / 100); rest -= amt; return { id: p.id, name: p.name, pct, amount: amt }; });
  }
  E.allocate = allocate;
  const firstDay = s => { let k = null; s.journal.forEach(j => { if (!k || j.date < k) k = j.date; }); s.orders.forEach(o => { if (!k || o.date < k) k = o.date; }); return k; };
  E.firstDay = firstDay;
  // What stops a day from closing: work that is not finished yet. Each row says where to go to finish it.
  function closeBlockers(s, key) {
    const out = [];
    const open = s.orders.filter(o => ['open', 'incoming'].includes(o.status.order) && o.date <= key);
    if (open.length) out.push({ k: 'orders', n: open.length, text: open.length === 1 ? 'طلب لم يُسلّم: ' + open[0].no : open.length + ' طلبات لم تُسلّم', refs: open.map(o => o.no), go: 'orders', tab: 'live' });
    const ses = s.sessions.filter(x => x.status === 'open' && x.date <= key);
    if (ses.length) out.push({ k: 'sessions', n: ses.length, text: ses.length === 1 ? 'وردية لم تُغلق: ' + ses[0].uname : ses.length + ' ورديات لم تُغلق', refs: ses.map(x => x.id), go: 'treasury', tab: 'sessions' });
    const rv = s.sessions.filter(x => x.status === 'review' && x.date <= key);
    if (rv.length) out.push({ k: 'review', n: rv.length, text: rv.length === 1 ? 'وردية بانتظار اعتماد التسليم: ' + rv[0].uname : rv.length + ' ورديات بانتظار اعتماد التسليم', refs: rv.map(x => x.id), go: 'treasury', tab: 'sessions' });
    return out;
  }
  E.closeBlockers = closeBlockers;
  def('day.close', {
    label: 'إقفال يوم', perm: 'day.close',
    run(s, a, ctx) {
      const key = a.date; must(keyValid(key), 'bad_date', 'اختر اليوم');
      must(key <= ctx.today, 'bad_date', 'لا يُقفل يوم لم يبدأ');
      must(!s.closes[key], 'closed', 'اليوم مقفل من قبل');
      const start = firstDay(s) || key;
      const prev = addDays(key, -1);
      must(key <= start || s.closes[prev] || prev < start, 'order', 'أقفل يوم ' + prev + ' أولًا');
      const total = sum(s.settings.partners, p => shareAt(p, key));
      must(Math.abs(total - 100) < 1e-9, 'bad_total', 'نسب الشركاء مجموعها ' + total + '% ويجب أن يكون 100%');
      const blockers = closeBlockers(s, key);
      must(!blockers.length, 'blocked', 'لا يمكن إقفال ' + key + ': ' + blockers.map(b => b.text).join('، ') + '. أكملها أولًا', { blockers });
      const dctx = Object.assign({}, ctx, { date: key });
      accruals(s, key).forEach(x => {
        const ik = key + ':' + x.k + ':' + (x.emp || x.asset || '');
        if (s.accrued[ik]) return;
        let lines, memo;
        if (x.k === 'wage') { lines = [{ a: '6300', d: x.amount }, { a: '2200', c: x.amount, p: 'emp:' + x.emp }]; memo = 'أجر ' + x.name + ' يوم ' + key; }
        else { lines = [{ a: '6400', d: x.amount }, { a: '1590', c: x.amount, p: 'ast:' + x.asset }]; memo = 'إهلاك ' + x.name + ' يوم ' + key; const as = s.assets.find(k => k.id === x.asset); as.dep += x.amount; }
        post(s, dctx, { memo, src: { t: 'close', id: key }, lines });

      }
      const dayEntries = s.journal.filter(j => j.date === key);
      s.closes[key] = { day: key, at: ctx.at, by: ctx.user.id, net: res.net, alloc, dist: dist ? dist.id : null, n: dayEntries.length, sig: sum(dayEntries, j => sum(j.lines, l => l.d)) };
      ctx.ref = key; ctx.note = (res.net >= 0 ? 'ربح ' : 'خسارة ') + f3(Math.abs(res.net)) + ' د.ل';
      return { day: key, net: res.net, alloc };
    },
  });
  // Reopening is for the last closed day only, with a partner's approval: the distribution is reversed and the day can be corrected and closed again.

  /* =================== Customers, complaints, rewards =================== */
  const COMPLAINT_CATS = { late: 'تأخير', missing: 'صنف ناقص', wrong: 'طلب خاطئ', quality: 'جودة الطعام', packaging: 'التغليف', staff: 'تعامل الموظف', payment: 'مشكلة في الدفع', clean: 'نظافة', other: 'أخرى' };
  const COMPLAINT_CAUSES = { kitchen: 'المطبخ', delivery: 'التوصيل', cashier: 'الكاشير', supplier: 'المورد', system: 'النظام', customer: 'من الزبون', unknown: 'غير محدد' };
  const COMPLAINT_STATES = { new: 'جديدة', in_progress: 'قيد المعالجة', resolved: 'محلولة', closed: 'مغلقة دون تعويض' };
  Object.assign(E, { COMPLAINT_CATS, COMPLAINT_CAUSES, COMPLAINT_STATES });
  const custOf = (s, id) => { const c = s.customers.find(x => x.id === id); must(c, 'not_found', 'الزبون غير موجود'); return c; };

  def('cust.save', {
    label: 'حفظ زبون', perm: 'customers.basic',
    run(s, a, ctx) {
      let c = a.id ? custOf(s, a.id) : null;

      if (!c) {
        must(!other, 'dup_phone', 'هذا الرقم مسجّل لزبون آخر');

        must(!other || other === c.id, 'dup_phone', 'هذا الرقم مسجّل لزبون آخر');

  def('complaint.add', {
    label: 'تسجيل شكوى', perm: 'complaints.create', backdatable: true,
    run(s, a, ctx) {
      must(COMPLAINT_CATS[a.category], 'bad_value', 'اختر نوع الشكوى');
      must(text(a.text), 'bad_value', 'اكتب ما حدث');
      const o = a.orderNo ? orderOf(s, a.orderNo) : null;

  function createSync(E, db, cfg) {
    cfg = cfg || {};

    async function dbc(p) {

    /* ---------- Lease: one writer at a time, across devices and across the tabs of one device ---------- */
    async function withLease(fn) {

    /* ---------- Reading the log ---------- */
