<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>ريڤو</title>
<style>
:root { --brand: #006AFF; --ink: #0f1522; --ink-2: #44506a; --bg: #ffffff; --bg-2: #f4f7fb; --line: #e3e8f0; }
@media (prefers-color-scheme: dark) { :root { --ink: #eef2f8; --ink-2: #c2cad8; --bg: #0e1320; --bg-2: #151c2c; --line: #27314a; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.7; padding: 24px; }
.card { max-width: 440px; width: 100%; background: var(--bg-2); border: 1px solid var(--line); border-radius: 20px; padding: 32px 28px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.logo { width: 56px; height: 56px; border-radius: 16px; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 28px; font-weight: 700; }
h1 { margin: 6px 0 0; font-size: 22px; }
p { margin: 0; color: var(--ink-2); font-size: 15px; }
button { font: inherit; font-weight: 600; font-size: 16px; padding: 12px 24px; border-radius: 12px; border: 0; background: var(--brand); color: #fff; cursor: pointer; margin-top: 8px; }
button:active { transform: translateY(1px); }
small { color: var(--ink-2); font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">ر</div>
  <h1>لا يمكن الوصول إلى الخادم الآن</h1>
  <p>لم يُفتح التطبيق على هذا الكمبيوتر من قبل، فهو يحتاج إلى الإنترنت في المرة الأولى فقط. بعدها يعمل بلا اتصال.</p>
  <p>تأكد من الاتصال بالإنترنت ثم اضغط «إعادة المحاولة».</p>
  <button id="retry">إعادة المحاولة</button>
  <small id="code"></small>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search); var url = q.get('url') || 'https://hussain98898.github.io/revo/cloud/app/';
  var code = q.get('code'); if (code) document.getElementById('code').textContent = 'رمز الخطأ ' + code;
  var go = function () { location.replace(url); };
  document.getElementById('retry').addEventListener('click', go);
  window.addEventListener('online', go);
  setTimeout(function () { if (navigator.onLine) go(); }, 15000);
})();
</script>
</body>
</html>
